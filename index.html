<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jake and Galilee's Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* SKY - layered so we can crossfade smoothly instead of snapping colors */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 0;
            overflow: hidden;
        }

        .sky-layer {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 4s ease-in-out;
        }

        .sky-layer.active {
            opacity: 1;
        }

        .sky-layer.night {
            background: linear-gradient(to bottom, #0a0e27, #1a1a3a);
        }

        .sky-layer.day {
            background: linear-gradient(to bottom, #87ceeb, #e0f6ff);
        }

        .sky-layer.sunset {
            background: linear-gradient(to bottom, #ff6b35, #ffa366, #ffe0b3);
        }

        /* MOON & STARS (night) */
        .moon {
            position: absolute;
            top: 12%;
            right: 15%;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fffdf2, #eee8c9 55%, #d3cca3 100%);
            box-shadow: 0 0 25px 6px rgba(255, 253, 242, 0.45);
        }

        .moon::before {
            content: '';
            position: absolute;
            top: 18%;
            left: 15%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(180, 172, 140, 0.4);
        }

        .moon::after {
            content: '';
            position: absolute;
            bottom: 20%;
            right: 20%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(180, 172, 140, 0.35);
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.9);
            animation: twinkle 2.6s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* SUN (day) */
        .sun {
            position: absolute;
            top: 10%;
            right: 18%;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff9c4, #ffd54f 55%, #ffb300 100%);
            box-shadow: 0 0 45px 12px rgba(255, 193, 7, 0.5);
        }

        /* GROUND */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, #2d8659, #1a5033);
            z-index: 1;
        }

        /* WAVY GRASS HILLS */
        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(to bottom, #3da66f, #35945a);
            z-index: 2;
            clip-path: polygon(
                0% 100%,
                0% 70%,
                2% 65%,
                4% 62%,
                6% 65%,
                8% 70%,
                10% 75%,
                12% 72%,
                14% 65%,
                16% 60%,
                18% 65%,
                20% 75%,
                22% 80%,
                24% 75%,
                26% 65%,
                28% 58%,
                30% 65%,
                32% 75%,
                34% 82%,
                36% 78%,
                38% 68%,
                40% 60%,
                42% 65%,
                44% 75%,
                46% 80%,
                48% 75%,
                50% 65%,
                52% 58%,
                54% 65%,
                56% 75%,
                58% 80%,
                60% 75%,
                62% 68%,
                64% 60%,
                66% 65%,
                68% 75%,
                70% 80%,
                72% 75%,
                74% 65%,
                76% 58%,
                78% 65%,
                80% 75%,
                82% 80%,
                84% 75%,
                86% 68%,
                88% 60%,
                90% 65%,
                92% 75%,
                94% 80%,
                96% 75%,
                98% 70%,
                100% 75%,
                100% 100%
            );
        }

        /* PATH - confined to the ground area, tapering for perspective */
        .path {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 34%;
            background: linear-gradient(to bottom, #c9a876 0%, #b58c5c 60%, #a3794d 100%);
            z-index: 2.5;
            clip-path: polygon(40% 0%, 60% 0%, 100% 100%, 0% 100%);
            opacity: 0.85;
        }

        .path::after {
            content: '';
            position: absolute;
            top: 8%;
            bottom: 4%;
            left: 50%;
            width: 3px;
            transform: translateX(-50%);
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.5) 0,
                rgba(255, 255, 255, 0.5) 10px,
                transparent 10px,
                transparent 22px
            );
        }

        /* MAIN GAME AREA */
        .game-area {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 3;
        }

        /* LOCATION TEXT - appears above characters */
        .location-text {
            position: relative;
            z-index: 25;
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            text-align: center;
        }

        /* CHARACTERS - raised above the UI panel so they're never hidden behind it */
        .characters {
            position: relative;
            z-index: 20;
            display: flex;
            gap: 50px;
            align-items: flex-end;
            animation: walk 3s ease-in-out infinite;
            margin-bottom: 60px;
            transition: margin-bottom 1.5s ease-in-out;
        }

        .characters.moving {
            animation: none;
            margin-bottom: 200px;
        }

        @keyframes walk {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .character {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .character-sprite {
            width: 80px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Jake - Brown Hair, Male */
        .character-sprite.jake {
            background: none;
        }

        .jake-head {
            width: 35px;
            height: 40px;
            background: #f4a460;
            border-radius: 50%;
            position: absolute;
            top: 10px;
        }

        .jake-hair {
            width: 44px;
            height: 26px;
            background: linear-gradient(135deg, #8a5a35, #6b4423 75%);
            border-radius: 60% 40% 30% 20%;
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
        }

        .jake-hair::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 14px;
            background: inherit;
            border-radius: 60% 40% 50% 30%;
            top: 10px;
            left: -5px;
            transform: rotate(-18deg);
        }

        .jake-hair::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 12px;
            background: inherit;
            border-radius: 40% 60% 30% 50%;
            top: 8px;
            right: -5px;
            transform: rotate(16deg);
        }

        .jake-mustache {
            width: 16px;
            height: 5px;
            background: #6b4423;
            border-radius: 50% 50% 60% 60% / 100% 100% 40% 40%;
            position: absolute;
            top: 33px;
            left: 50%;
            transform: translateX(-50%);
        }

        .jake-body {
            width: 45px;
            height: 50px;
            background: #5b7c99;
            border-radius: 8px 8px 6px 6px;
            position: absolute;
            top: 50px;
        }

        .jake-collar {
            width: 16px;
            height: 14px;
            background: #f5f5f5;
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            clip-path: polygon(0 0, 100% 0, 65% 100%, 35% 100%);
        }

        .jake-tie {
            width: 7px;
            height: 34px;
            background: #ff8fab;
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 3px 3px;
        }

        .jake-legs {
            width: 40px;
            height: 30px;
            background: #33445c;
            border-radius: 0 0 8px 8px;
            position: absolute;
            bottom: 0;
        }

        .jake-eyes {
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 22px;
        }

        .jake-eye-left {
            left: 12px;
        }

        .jake-eye-right {
            right: 12px;
        }

        /* Galilee - Blonde Hair, Female */
        .character-sprite.galilee {
            background: none;
        }

        .galilee-head {
            width: 35px;
            height: 40px;
            background: #f4a460;
            border-radius: 50%;
            position: absolute;
            top: 10px;
        }

        .galilee-hair {
            width: 44px;
            height: 28px;
            background: linear-gradient(150deg, #f5da9e, #e0b358 75%);
            border-radius: 55% 55% 20% 20%;
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
        }

        .galilee-hair::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 6px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            top: 5px;
            left: 9px;
            transform: rotate(-20deg);
        }

        .galilee-hair-long {
            width: 9px;
            height: 36px;
            background: linear-gradient(180deg, #f5da9e, #e0b358 60%, #cf9f47);
            position: absolute;
            top: 27px;
            border-radius: 50% 50% 60% 60%;
        }

        .galilee-hair-left {
            left: 3px;
            transform: rotate(-9deg);
        }

        .galilee-hair-right {
            right: 3px;
            transform: rotate(9deg);
        }

        .galilee-body {
            width: 45px;
            height: 50px;
            background: #f6b6c6;
            border-radius: 8px;
            position: absolute;
            top: 50px;
        }

        .galilee-legs {
            width: 40px;
            height: 30px;
            background: #f8c8d5;
            border-radius: 0 0 8px 8px;
            position: absolute;
            bottom: 0;
        }

        .galilee-eyes {
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 22px;
        }

        .galilee-eye-left {
            left: 12px;
        }

        .galilee-eye-right {
            right: 12px;
        }

        .character-name {
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-top: 10px;
        }

        /* STOPPING POINT */
        .stopping-point {
            position: absolute;
            bottom: 150px;
            right: 10%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 4;
        }

        .stopping-point:hover {
            transform: scale(1.1);
        }

        .stopping-point-image {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 3px solid #ffd700;
            background: #333;
            font-size: 60px;
            margin-bottom: 8px;
        }

        .stopping-point-image.no-box {
            width: 520px;
            height: 520px;
            background: none;
            border: none;
            box-shadow: none;
        }

        .point-label {
            text-align: center;
            font-size: 12px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* UI PANEL - pinned to the left edge, narrower, and behind the characters */
        .ui-panel {
            position: fixed;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 16px;
            border-radius: 15px;
            text-align: center;
            width: 220px;
            max-width: 220px;
            z-index: 10;
            border: 2px solid #ffd700;
        }

        .memory-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .memory-date {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 8px;
        }

        .memory-description {
            font-size: 13px;
            color: white;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .btn-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #ffed4e;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 3px solid #ffd700;
            color: white;
        }

        .modal-title {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
        }

        .game-cell {
            width: 100px;
            height: 100px;
            background: #ffd700;
            border: none;
            font-size: 30px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .game-cell:hover {
            background: #ffed4e;
        }

        .game-cell:disabled {
            cursor: not-allowed;
        }

        .game-status {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
            color: #ffd700;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .memory-card {
            width: 100%;
            aspect-ratio: 1;
            background: #444;
            border: 2px solid #ffd700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .memory-card:hover {
            background: #555;
            transform: scale(1.05);
        }

        .memory-card.matched {
            background: #4CAF50;
            border-color: #8BC34A;
        }

        .close-btn {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #ffd700;
            background: none;
            border: none;
            padding: 0;
        }

        .close-btn:hover {
            color: #ffed4e;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #333;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            transition: width 0.3s ease;
        }

        .title-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            flex-direction: column;
            gap: 30px;
        }

        .title-screen.hidden {
            display: none;
        }

        .title {
            font-size: 60px;
            font-weight: bold;
            color: white;
            text-align: center;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 24px;
            color: #ffd;
            text-align: center;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: scale(1.05);
            background: #ffed4e;
        }
    </style>
</head>
<body>
    <div class="title-screen" id="titleScreen">
        <div class="title">💕 Jake & Galilee's Journey 💕</div>
        <div class="subtitle">A love story told through memories, games, and moments we'll never forget</div>
        <button class="start-btn" onclick="startJourney()">Begin the Journey</button>
    </div>

    <div class="game-container">
        <div class="sky" id="sky">
            <div class="sky-layer night" id="skyNight">
                <div class="moon"></div>
                <div class="star" style="top:15%; left:12%; animation-delay:0s;"></div>
                <div class="star" style="top:8%; left:30%; animation-delay:0.4s;"></div>
                <div class="star" style="top:22%; left:45%; animation-delay:0.8s;"></div>
                <div class="star" style="top:10%; left:60%; animation-delay:1.2s;"></div>
                <div class="star" style="top:28%; left:75%; animation-delay:0.6s;"></div>
                <div class="star" style="top:35%; left:20%; animation-delay:1.6s;"></div>
                <div class="star" style="top:40%; left:55%; animation-delay:2s;"></div>
                <div class="star" style="top:18%; left:88%; animation-delay:1s;"></div>
                <div class="star" style="top:45%; left:8%; animation-delay:1.8s;"></div>
                <div class="star" style="top:5%; left:80%; animation-delay:0.2s;"></div>
            </div>
            <div class="sky-layer day" id="skyDay">
                <div class="sun"></div>
            </div>
            <div class="sky-layer sunset" id="skySunset"></div>
        </div>
        <div class="ground"></div>
        <div class="grass"></div>
        <div class="path"></div>
        
        <div class="game-area">
            <!-- Location text appears above characters -->
            <div class="location-text" id="locationText"></div>

            <div class="characters" id="characters">
                <!-- Jake with brown hair -->
                <div class="character">
                    <div class="character-sprite jake">
                        <div class="jake-hair"></div>
                        <div class="jake-head">
                            <div class="jake-eyes jake-eye-left"></div>
                            <div class="jake-eyes jake-eye-right"></div>
                            <div class="jake-mustache"></div>
                        </div>
                        <div class="jake-body"></div>
                        <div class="jake-collar"></div>
                        <div class="jake-tie"></div>
                        <div class="jake-legs"></div>
                    </div>
                    <div class="character-name">Jake</div>
                </div>

                <!-- Galilee with blonde hair -->
                <div class="character">
                    <div class="character-sprite galilee">
                        <div class="galilee-hair"></div>
                        <div class="galilee-hair-long galilee-hair-left"></div>
                        <div class="galilee-hair-long galilee-hair-right"></div>
                        <div class="galilee-head">
                            <div class="galilee-eyes galilee-eye-left"></div>
                            <div class="galilee-eyes galilee-eye-right"></div>
                        </div>
                        <div class="galilee-body"></div>
                        <div class="galilee-legs"></div>
                    </div>
                    <div class="character-name">Galilee</div>
                </div>
            </div>

            <div class="stopping-point" id="stoppingPoint" onclick="arriveAtStop()">
                <div class="stopping-point-image" id="stopImage">📍</div>
                <div class="point-label" id="stopLabel">Next Stop</div>
            </div>
        </div>
    </div>

    <!-- UI PANEL - pinned to the left, vertically centered, below the characters in stacking order -->
    <div class="ui-panel" id="uiPanel" style="display: none;">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="memory-title" id="memoryTitle">Memory Title</div>
        <div class="memory-date" id="memoryDate">Date</div>
        <div class="memory-description" id="memoryDescription">Description</div>
        <div class="btn-container">
            <button onclick="playGame('current')">Play Game</button>
            <button onclick="nextStop()" id="nextBtn">Next Stop →</button>
        </div>
    </div>

    <!-- GAME MODAL -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeGame()">✕</button>
            <div class="modal-title" id="gameTitle">Mini Game</div>
            <div class="game-status" id="gameStatus"></div>
            <div id="gameContainer"></div>
        </div>
    </div>

    <script>
        const memories = [
            {
                id: 1,
                title: "First Meeting",
                date: "April 18, 2026",
                description: "The day we first met at Hurricane Harry's. A moment that changed everything. 🌟",
                location: "Hurricane Harry's",
                emoji: "🏗️",
                image: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect fill='%23FFD700' width='400' height='300'/%3E%3C/svg%3E"
            }
        ];

        function startJourney() {
            document.getElementById('titleScreen').classList.add('hidden');
            document.getElementById('uiPanel').style.display = 'block';
            loadMemory(memories[0]);
        }

        function loadMemory(memory) {
            document.getElementById('locationText').textContent = memory.location;
            document.getElementById('memoryTitle').textContent = memory.title;
            document.getElementById('memoryDate').textContent = memory.date;
            document.getElementById('memoryDescription').textContent = memory.description;
            updateProgress();
        }

        function updateProgress() {
            const progress = (1 / memories.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function playGame(type) {
            document.getElementById('gameModal').classList.add('active');
            document.getElementById('gameTitle').textContent = 'Memory Game';
            document.getElementById('gameContainer').innerHTML = '<p>Game Loading...</p>';
        }

        function closeGame() {
            document.getElementById('gameModal').classList.remove('active');
        }

        function nextStop() {
            alert('Next stop coming soon!');
        }

        function arriveAtStop() {
            alert('Welcome to the next memory!');
        }
    </script>
</body>
